<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Chaos Chess & Speed Shogi</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #1a1a2e;
            color: #ffffff;
            padding-top: 50px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .card {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 10px;
            padding: 30px;
            width: 250px;
            cursor: pointer;
            transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #e94560;
        }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Chaos Board Games</h1>
    <p>遊ぶモードを選択してください</p>

    <div class="container">
        <div class="card">
            <h2>Chaos Chess</h2>
            <p>スキル購入＆付与で戦うハチャメチャチェス！</p>
            <button onclick="alert('Chaos Chessは準備中です')">プレイ</button>
        </div>
        <div class="card">
            <h2>Speed Shogi</h2>
            <p>クールダウン制のリアルタイムスピード将棋！</p>
            <button onclick="alert('Speed Shogiは準備中です')">プレイ</button>
        </div>
    </div>
</body>
</html>
